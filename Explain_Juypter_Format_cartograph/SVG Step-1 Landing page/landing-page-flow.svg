<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the landing page is built and what it does</title>
  <desc id="d">Part A: opening / makes the server run layout.tsx and page.tsx, which reads data/ and sends back finished HTML. Part B: clicking Analyse sends the zip to the route handler, which streams stage lines back until the page moves to the map. Part C: the theme buttons write a cookie.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="760" rx="10" fill="#ffffff" stroke="#cbd5e1"/>

  <!-- legend -->
  <g font-size="12" fill="#334155">
    <rect x="800" y="18" width="14" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6"/><text x="820" y="30">runs in the browser</text>
    <rect x="990" y="18" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#64748b"/><text x="1010" y="30">runs on the server</text>
    <rect x="800" y="40" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706"/><text x="820" y="52">files on disk</text>
  </g>

  <!-- column titles -->
  <text x="190" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">BROWSER</text>
  <text x="640" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">NEXT.JS SERVER (same machine)</text>
  <path d="M390,50 V740" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <!-- ===== A ===== -->
  <text x="24" y="76" font-size="15" font-weight="700" fill="#0f172a">A · Opening  /</text>

  <rect x="60" y="92" width="260" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">GET /</text>
  <path d="M320,115 H430" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <rect x="430" y="82" width="300" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="580" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">app/layout.tsx</text>
  <text x="580" y="126" text-anchor="middle" font-size="12" fill="#334155">reads the theme cookie, sets data-theme</text>
  <path d="M730,115 H790" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <rect x="790" y="82" width="370" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="975" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">app/page.tsx  (server component)</text>
  <text x="975" y="126" text-anchor="middle" font-size="12" fill="#334155">connection() → listProjects() → rows</text>

  <path d="M975,148 V190" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <rect x="790" y="190" width="370" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="975" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">data/&lt;id&gt;/meta.json  (one per project)</text>
  <text x="975" y="230" text-anchor="middle" font-size="12" fill="#78350f">name, files, imports, routes, added</text>

  <path d="M790,165 H560 V175 H200 V150" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-dash)"/>
  <text x="400" y="190" text-anchor="middle" font-size="12" fill="#475569">finished HTML, header + form + table</text>

  <!-- ===== B ===== -->
  <text x="24" y="290" font-size="15" font-weight="700" fill="#0f172a">B · Clicking Analyse</text>

  <rect x="60" y="306" width="260" height="66" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">load-form.tsx  (client)</text>
  <text x="190" y="350" text-anchor="middle" font-size="12" fill="#1e3a8a">fetch, body = { path } (not the files)</text>
  <path d="M320,339 H430" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="375" y="331" text-anchor="middle" font-size="11" fill="#475569">POST</text>

  <rect x="430" y="306" width="300" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="580" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">api/projects/route.ts</text>
  <text x="580" y="350" text-anchor="middle" font-size="12" fill="#334155">checks the path, then runs</text>
  <path d="M730,339 H790" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <rect x="790" y="306" width="370" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="975" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">ingestPath()  [extract] → select → parse → store</text>
  <text x="975" y="350" text-anchor="middle" font-size="12" fill="#334155">calls report(stage, message) at each step</text>

  <path d="M975,372 V410" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <rect x="790" y="410" width="370" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="975" y="437" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">data/&lt;id&gt;/  written on "store"</text>

  <path d="M580,372 V500 H215" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-dash)"/>
  <text x="400" y="494" text-anchor="middle" font-size="12" fill="#475569">one JSON line per stage, as it happens</text>

  <rect x="60" y="500" width="260" height="66" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">stage list ticks on screen</text>
  <text x="190" y="544" text-anchor="middle" font-size="12" fill="#1e3a8a">last line "done" → router.push</text>
  <path d="M190,566 V600" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <rect x="60" y="600" width="260" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="625" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">/projects/&lt;id&gt;  (the map)</text>

  <!-- ===== C ===== -->
  <text x="430" y="610" font-size="15" font-weight="700" fill="#0f172a">C · Theme buttons</text>
  <rect x="430" y="624" width="730" height="90" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="795" y="650" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">theme-control.tsx  (client, no request)</text>
  <text x="795" y="672" text-anchor="middle" font-size="12" fill="#1e3a8a">sets data-theme on &lt;html&gt; now, and writes the "theme" cookie</text>
  <text x="795" y="692" text-anchor="middle" font-size="12" fill="#1e3a8a">next page load: layout.tsx reads the cookie, so the first HTML is already right</text>
</svg>
